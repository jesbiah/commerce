{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Active Listings</h2>

    
    {% for listing in listing %}
        <br>
        {% if listing.image_url %}
            <img alt="Image for {{ listing.title }}" href="{{ listing.image_url }}">
        {% endif %}
        <h3>{{ listing.title }}</h3>
        <p>{{ listing.description }}</p>
        <h6>{{ listing.current_price }}</h6>
        <br><hr>
    {% endfor %}

{% endblock %}
